<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godparent Confirmation Form | Melinoe Zyla Edria Almase Baptism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="invitation-opened" data-theme="blush">
    <main class="rsvp-shell">
        <div class="rsvp-layout">
            <section class="rsvp-card">
                <a class="back-link" data-back-link href="godparent.html?type=ninong">Back to invitation video</a>
                <p class="eyebrow">Godparent Confirmation</p>
                <h1 data-form-heading>Confirm your godparent invitation</h1>
                <p class="helper-text" data-form-copy>Please complete the form below so the family can receive your confirmation and update the godparents list.</p>

                <form data-godparent-form novalidate>
                    <div class="form-grid">
                        <label>
                            Full name
                            <input name="fullName" type="text" required>
                        </label>
                        <label>
                            Contact details
                            <input name="contactInfo" type="text" placeholder="Messenger name, mobile number, or email" required>
                        </label>
                        <label>
                            Your response
                            <select name="attendance" required>
                                <option value="">Select one</option>
                                <option value="Confirmed">I am honored to accept</option>
                                <option value="Unable to accept">I am unable to accept</option>
                            </select>
                        </label>
                        <input name="role" type="hidden" value="Godparent">
                        <label class="full-width">
                            Message for the family
                            <textarea name="message" rows="4" placeholder="Optional"></textarea>
                        </label>
                    </div>

                    <button class="button" type="submit">Send Confirmation</button>
                    <p class="status-text" data-status-text></p>
                </form>
            </section>
        </div>
    </main>

    <script src="godparent-form.js"></script>
</body>
</html>
